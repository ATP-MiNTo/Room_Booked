events { 
    worker_connections 1024; 
}

http {
    server {
        listen 80;
        server_name localhost; 

        # โซน Backend (API ปกติ)
        location ~ ^/(reserve-with-image|booked-seats|reservations) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ✨ โซน WebSocket (สำหรับที่นั่งสีเหลือง) ✨
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;       # 👈 สำคัญมาก! เปลี่ยนจาก HTTP ธรรมดาเป็นสายแชท
            proxy_set_header Connection "Upgrade";        # 👈 สำคัญมาก! สั่งไม่ให้ตัดสาย
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # โซนรูปภาพ
        location /data/ {
            proxy_pass http://backend:8000/data/;
        }

        # โซน Frontend (React)
        location / {
            proxy_pass http://frontend:5173; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
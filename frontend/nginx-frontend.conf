server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # Proxy API และ routes อื่นๆ ไปที่ backend
    location ~ ^/(reserve-with-image|booked-seats|reservations|api|data) {
        proxy_pass https://reserve-monitor-comlab-production.up.railway.app;
        proxy_set_header Host reserve-monitor-comlab-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /ws/ {
        proxy_pass https://reserve-monitor-comlab-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host reserve-monitor-comlab-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

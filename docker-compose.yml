version: '3.8'

services:
  # 1. Database Service
  db:
    image: postgres:15-alpine
    container_name: complab_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_db:/var/lib/postgresql/data
    networks:
      - complab_network

  # 2. Nginx Service (ยามหน้าประตู)
  nginx:
    image: nginx:latest
    container_name: complab_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - complab_network

  # 3. Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: complab_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - db
    networks:
      - complab_network

  # 4. Frontend Service (React/Vite)
  frontend:
    build: ./frontend
    container_name: complab_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - complab_network

networks:
  complab_network:
    driver: bridge